basePath: /api
definitions:
  app_controllers_admin_emailtemplate.EmailPreviewRequest:
    properties:
      content:
        type: string
      vars:
        additionalProperties: true
        type: object
    required:
    - content
    type: object
  app_controllers_admin_emailtemplate.EmailSendTestRequest:
    properties:
      content:
        type: string
      subject:
        type: string
      template_id:
        description: 可选：使用模板发送
        type: integer
      to:
        type: string
    required:
    - to
    type: object
  app_controllers_admin_emailtemplate.EmailTemplateUpdateRequest:
    properties:
      content:
        type: string
      description:
        type: string
      status:
        type: integer
      subject:
        type: string
    required:
    - content
    type: object
  app_controllers_admin_payment.BatchRefreshRatesRequest:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  app_controllers_admin_payment.CurrencyConfigRequest:
    properties:
      base_currency:
        maxLength: 10
        type: string
      currency_dynamic_source:
        maxLength: 50
        type: string
      currency_dynamic_source_url:
        maxLength: 512
        type: string
    type: object
  app_controllers_admin_payment.ExchangeRateRequest:
    properties:
      fixed_amount:
        type: number
      from_currency:
        maxLength: 10
        type: string
      rate:
        type: number
      rate_type:
        maxLength: 20
        type: string
      source:
        maxLength: 255
        type: string
      to_currency:
        maxLength: 10
        type: string
    required:
    - from_currency
    - rate
    - rate_type
    - to_currency
    type: object
  app_controllers_admin_payment.UpdateExchangeRateRequest:
    properties:
      fixed_amount:
        type: number
      from_currency:
        maxLength: 10
        type: string
      rate:
        type: number
      rate_type:
        maxLength: 20
        type: string
      source:
        maxLength: 255
        type: string
      to_currency:
        maxLength: 10
        type: string
    required:
    - from_currency
    - rate
    - rate_type
    - to_currency
    type: object
  app_controllers_admin_realname.ReviewRealnameRequest:
    properties:
      id:
        type: integer
      reject_reason:
        type: string
      status:
        maximum: 2
        minimum: 1
        type: integer
    required:
    - id
    - status
    type: object
  app_controllers_admin_settings.BatchUpdateSettingsRequest:
    properties:
      settings:
        additionalProperties:
          type: string
        type: object
    required:
    - settings
    type: object
  app_controllers_admin_settings.CreateSettingRequest:
    properties:
      category:
        description: basic, security, email, custom
        type: string
      description:
        type: string
      is_editable:
        type: boolean
      is_public:
        type: boolean
      key:
        type: string
      label:
        type: string
      sort_order:
        type: integer
      type:
        description: string, number, boolean, json
        type: string
      value:
        type: string
    required:
    - key
    - label
    type: object
  app_controllers_admin_settings.SettingsListResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/fst_backend_app_models.SettingsGroup'
        type: array
    type: object
  app_controllers_admin_settings.UpdateSettingMetaRequest:
    properties:
      category:
        type: string
      description:
        type: string
      is_editable:
        type: boolean
      is_public:
        type: boolean
      label:
        type: string
      sort_order:
        type: integer
      type:
        type: string
      value:
        type: string
    type: object
  app_controllers_admin_settings.UpdateSettingRequest:
    properties:
      value:
        type: string
    type: object
  app_controllers_admin_smstemplate.SMSPreviewRequest:
    properties:
      content:
        type: string
      vars:
        additionalProperties: true
        type: object
    required:
    - content
    type: object
  app_controllers_admin_smstemplate.SMSSendTestRequest:
    properties:
      lang:
        type: string
      phone:
        type: string
    required:
    - phone
    type: object
  app_controllers_admin_smstemplate.SMSTemplateUpdateRequest:
    properties:
      content:
        type: string
      description:
        type: string
      sign_name:
        type: string
      status:
        type: integer
    required:
    - content
    type: object
  app_controllers_admin_user.AdminUserDetailResponse:
    properties:
      realname:
        $ref: '#/definitions/app_controllers_admin_user.AdminUserRealnameSummary'
      user:
        $ref: '#/definitions/fst_backend_app_services.AdminUserListItem'
    type: object
  app_controllers_admin_user.AdminUserRealnameSummary:
    properties:
      certificate_no:
        type: string
      certificate_type:
        type: integer
      has_verification:
        type: boolean
      id:
        type: integer
      real_name:
        type: string
      reject_reason:
        type: string
      reviewed_at:
        type: integer
      status:
        type: integer
      submitted_at:
        type: integer
    type: object
  app_controllers_public_auth.LoginRequest:
    properties:
      authGuard:
        type: string
      clientType:
        type: string
      password:
        type: string
      userName:
        type: string
      username:
        type: string
    required:
    - password
    type: object
  app_controllers_public_auth.RefreshTokenRequest:
    properties:
      authGuard:
        type: string
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  app_controllers_public_auth.RegisterRequest:
    properties:
      code:
        type: string
      email:
        maxLength: 255
        type: string
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - code
    - email
    - password
    - username
    type: object
  app_controllers_public_auth.ResetEmailRequest:
    properties:
      email:
        type: string
      lang:
        type: string
    required:
    - email
    type: object
  app_controllers_public_auth.ResetPasswordConfirmRequest:
    properties:
      code:
        type: string
      email:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - code
    - email
    - new_password
    type: object
  app_controllers_public_auth.SendCodeRequest:
    properties:
      email:
        type: string
      lang:
        type: string
    required:
    - email
    type: object
  app_controllers_public_geo.DialCountriesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/utils.DialCountry'
        type: array
    type: object
  app_controllers_public_geo.PhoneCountryResponse:
    properties:
      country_code:
        type: string
      dial_code:
        type: string
      ip_detect_enabled:
        type: boolean
      mobile_cn_only:
        type: boolean
      name_en:
        type: string
      name_zh:
        type: string
      source:
        description: cn_only | header | ip | lang | default
        type: string
    type: object
  app_controllers_public_settings.AppConfigResponse:
    properties:
      admin_api_path:
        description: 管理端 REST API 在 /api/v1 下的前缀（来自 env ADMIN_API_PATH，默认 /admin）
        type: string
      allow_delete_account:
        type: boolean
      allow_register:
        description: 功能开关
        type: boolean
      allow_user_login:
        type: boolean
      announcement_enabled:
        type: boolean
      copyright:
        type: string
      default_lang:
        description: 语言配置
        type: string
      email_verify_enabled:
        description: 验证码开关
        type: boolean
      geetest_captcha_id:
        description: 极验配置
        type: string
      geetest_enabled:
        type: boolean
      icp:
        type: string
      mobile_cn_only:
        type: boolean
      mobile_ip_country_detect:
        description: MobileIPCountryDetect 仅在关闭「仅大陆号」时生效：按 IP/CDN 预选区号
        type: boolean
      online_report_interval_seconds:
        description: 在线心跳上报周期（秒），前端 Presence 心跳按此间隔发送
        type: integer
      presence_enabled:
        description: Presence / 在线心跳总开关（默认 false）
        type: boolean
      realname_enabled:
        description: 实名认证配置
        type: boolean
      realname_notify_text:
        type: string
      site_desc:
        type: string
      site_logo:
        type: string
      site_name:
        description: 基本配置
        type: string
      sms_verify_enabled:
        type: boolean
      user_api_log_visible:
        type: boolean
      user_operation_log_visible:
        type: boolean
      version:
        type: string
      withdraw_account_types:
        items:
          type: string
        type: array
      withdraw_enabled:
        description: 提现配置
        type: boolean
      withdraw_min_amount:
        type: number
      withdraw_notify_text:
        type: string
    type: object
  app_controllers_user_payment.CreateOrderRequest:
    properties:
      amount:
        type: number
      gateway_id:
        type: integer
      subject:
        type: string
    required:
    - amount
    - gateway_id
    type: object
  app_controllers_user_profile.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  app_controllers_user_profile.DeactivateAccountRequest:
    properties:
      password:
        type: string
      reason:
        type: string
    required:
    - password
    type: object
  app_controllers_user_profile.ProfileRealnameSummary:
    properties:
      certificateNo:
        type: string
      certificateType:
        type: integer
      hasVerification:
        type: boolean
      id:
        type: integer
      realName:
        type: string
      rejectReason:
        type: string
      reviewedAt:
        type: integer
      status:
        type: integer
      submittedAt:
        type: integer
    type: object
  app_controllers_user_profile.ProfileResponse:
    properties:
      avatar:
        type: string
      back_ground:
        type: string
      backGround:
        type: string
      birthday:
        type: integer
      country:
        type: string
      createTime:
        type: integer
      email:
        type: string
      gender:
        type: integer
      groupId:
        type: integer
      id:
        type: integer
      joinIp:
        type: string
      joinTime:
        type: integer
      language:
        type: string
      lastLoginIp:
        type: string
      lastLoginTime:
        type: integer
      level:
        type: integer
      loginFailure:
        type: integer
      mobile:
        type: string
      money:
        type: number
      motto:
        type: string
      nickname:
        type: string
      realname:
        $ref: '#/definitions/app_controllers_user_profile.ProfileRealnameSummary'
      role:
        type: string
      score:
        type: integer
      status:
        type: integer
      updateTime:
        type: integer
      userName:
        type: string
      username:
        type: string
    type: object
  app_controllers_user_profile.SendEmailCodeRequest:
    properties:
      lang:
        type: string
      new_email:
        type: string
    required:
    - new_email
    type: object
  app_controllers_user_profile.SendPhoneCodeRequest:
    properties:
      new_mobile:
        type: string
    required:
    - new_mobile
    type: object
  app_controllers_user_profile.UpdateProfileRequest:
    properties:
      avatar:
        type: string
      back_ground:
        type: string
      birthday:
        type: integer
      country:
        type: string
      gender:
        type: integer
      language:
        type: string
      mobile:
        type: string
      motto:
        type: string
      nickname:
        type: string
    type: object
  app_controllers_user_profile.UpdateSettingsRequest:
    properties:
      language:
        type: string
      notify_email:
        type: boolean
      theme:
        type: string
    type: object
  app_controllers_user_profile.VerifyEmailChangeRequest:
    properties:
      code:
        type: string
      new_email:
        type: string
    required:
    - code
    - new_email
    type: object
  app_controllers_user_profile.VerifyPhoneChangeRequest:
    properties:
      code:
        type: string
      new_mobile:
        type: string
    required:
    - code
    - new_mobile
    type: object
  app_controllers_user_realname.SubmitRealnameRequest:
    properties:
      certificate_back:
        type: string
      certificate_front:
        type: string
      certificate_no:
        type: string
      certificate_type:
        maximum: 3
        minimum: 1
        type: integer
      real_name:
        type: string
    required:
    - certificate_back
    - certificate_front
    - certificate_no
    - certificate_type
    - real_name
    type: object
  fst_backend_app_models.SettingDTO:
    properties:
      category:
        type: string
      description:
        type: string
      is_editable:
        type: boolean
      is_public:
        type: boolean
      key:
        type: string
      label:
        type: string
      type:
        type: string
      value: {}
    type: object
  fst_backend_app_models.SettingsGroup:
    properties:
      category:
        type: string
      items:
        items:
          $ref: '#/definitions/fst_backend_app_models.SettingDTO'
        type: array
      label:
        type: string
    type: object
  fst_backend_app_services.AdminUserListItem:
    properties:
      admin_remark:
        type: string
      apikey:
        description: ApikeyMasked 管理端列表/详情展示用：仅末4位，不下发明文
        type: string
      avatar:
        type: string
      back_ground:
        type: string
      balance_paid_ratio:
        type: number
      birthday:
        type: integer
      country:
        type: string
      create_time:
        type: integer
      email:
        type: string
      gender:
        type: integer
      group_id:
        type: integer
      id:
        type: integer
      is_online:
        description: IsOnline 当前是否在线（依据 LastSeenAt 与在线心跳容忍窗口判定，与专门的在线用户页口径一致）。
        type: boolean
      join_ip:
        type: string
      join_time:
        type: integer
      language:
        type: string
      last_login_ip:
        type: string
      last_login_time:
        type: integer
      last_seen_at:
        description: |-
          LastSeenAt 最近一次会话心跳时间（跨全部设备取最大值），来自 user_sessions；无会话记录时为 0。
          仅供列表展示「上次在线」参考，不代表当前是否在线。
        type: integer
      level:
        type: integer
      lock_until:
        description: 账户锁定到期时间（时间戳）
        type: integer
      login_failure:
        type: integer
      mobile:
        type: string
      money:
        description: 余额（元，DECIMAL；业务加减一律经 utils 按「分」整数计算）
        type: number
      motto:
        type: string
      nickname:
        type: string
      realname_status:
        type: integer
      role:
        description: '''user'' or ''admin'''
        type: string
      score:
        type: integer
      status:
        type: integer
      total_paid_amount:
        type: number
      update_time:
        type: integer
      username:
        description: MySQL：string 未指定 size 时 GORM 会迁成 longtext，无法建唯一索引（Error 1170）
        type: string
    type: object
  fst_backend_app_services.UserCreateRequest:
    properties:
      admin_remark:
        type: string
      country:
        type: string
      email:
        type: string
      group_id:
        type: integer
      language:
        type: string
      level:
        type: integer
      mobile:
        type: string
      nickname:
        type: string
      password:
        type: string
      role:
        type: string
      status:
        description: Status 用指针区分「未传」与「显式禁用」：未传默认启用；显式 0 才创建为禁用账号
        type: integer
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  fst_backend_app_services.UserUpdateRequest:
    properties:
      admin_remark:
        type: string
      avatar:
        type: string
      back_ground:
        type: string
      birthday:
        type: integer
      country:
        type: string
      email:
        type: string
      gender:
        description: 指针类型，允许设置为0（保密）
        type: integer
      group_id:
        type: integer
      id:
        type: integer
      language:
        type: string
      level:
        type: integer
      mobile:
        type: string
      motto:
        type: string
      nickname:
        type: string
      role:
        type: string
      status:
        type: integer
    type: object
  utils.DialCountry:
    properties:
      code:
        description: CN / US
        type: string
      dial_code:
        description: 86 / 1（不含 +）
        type: string
      name_en:
        type: string
      name_zh:
        type: string
    type: object
  utils.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  管理端补单请求:
    properties:
      force:
        description: 强制补单（canceled/failed 高危路径，须填 memo）
        type: boolean
      memo:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: FST Platform 后端 API 接口文档
  title: FST Platform API
  version: "1.0"
paths:
  /v1/admin/announcements:
    get:
      responses: {}
      security:
      - BearerAuth: []
      summary: 管理端公告列表
      tags:
      - Admin-公告
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 管理端公告创建
      tags:
      - Admin-公告
  /v1/admin/announcements/{id}:
    delete:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 管理端公告删除
      tags:
      - Admin-公告
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 管理端公告详情
      tags:
      - Admin-公告
    put:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 管理端公告更新
      tags:
      - Admin-公告
  /v1/admin/announcements/{id}/publish:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 管理端公告发布
      tags:
      - Admin-公告
  /v1/admin/announcements/{id}/unpublish:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 管理端公告下架
      tags:
      - Admin-公告
  /v1/admin/api-logs:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: API接口日志列表
      tags:
      - Admin-API日志
  /v1/admin/api-logs/{id}:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: API接口日志详情
      tags:
      - Admin-API日志
  /v1/admin/api-logs/clean:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 清理API接口日志
      tags:
      - Admin-API日志
  /v1/admin/api-logs/stats:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: API接口日志统计
      tags:
      - Admin-API日志
  /v1/admin/auto-jobs:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 自动任务定义列表
      tags:
      - Admin-自动任务
  /v1/admin/auto-jobs/{job_code}:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 自动任务定义详情
      tags:
      - Admin-自动任务
    put:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 更新自动任务定义
      tags:
      - Admin-自动任务
  /v1/admin/auto-jobs/{job_code}/disable:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 禁用自动任务
      tags:
      - Admin-自动任务
  /v1/admin/auto-jobs/{job_code}/enable:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 启用自动任务
      tags:
      - Admin-自动任务
  /v1/admin/auto-jobs/{job_code}/run:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 立即执行自动任务
      tags:
      - Admin-自动任务
  /v1/admin/auto-jobs/config:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 获取自动任务配置
      tags:
      - Admin-自动任务
    put:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 更新自动任务配置
      tags:
      - Admin-自动任务
  /v1/admin/auto-jobs/handlers:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 列出自动任务处理器
      tags:
      - Admin-自动任务
  /v1/admin/auto-jobs/overview:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
